<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="description" content="Asia 的书架：翻开 1000 页温柔而坚定的《答案之书》，或阅读青春小说《晚风替我记得》。">
  <title>Asia 的书架</title>
  <link rel="icon" href="answer-book/favicon.svg" type="image/svg+xml">
  <script>
    if (/^#(?:chapter-\d+|cover)$/.test(location.hash)) {
      location.replace('./wanfeng/' + location.search + location.hash);
    }
  </script>
  <style>
    @font-face{font-family:WenKai;src:url('./answer-book/assets/WenKai.woff2') format('woff2');font-display:swap}
    :root{color-scheme:light;--paper:#f5f2e9;--ink:#403b31;--muted:#746b5d;--line:#dcd5c8;--accent:#785f40}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:WenKai,'Songti SC','SimSun',serif;-webkit-font-smoothing:antialiased}
    main{width:min(820px,calc(100% - 64px));margin:0 auto;padding:64px 0 32px}
    .signature{display:inline-block;color:var(--accent);font:20px Georgia,serif;letter-spacing:.06em}
    header{padding:42px 0 32px}
    h1{font-size:36px;line-height:1.4;font-weight:500;margin:0 0 12px;letter-spacing:.04em}
    header p{margin:0;color:var(--muted);font-size:17px;line-height:1.8}
    .books{border-top:1px solid var(--line)}
    .book{display:grid;grid-template-columns:48px minmax(0,1fr) 140px;gap:24px;align-items:center;padding:32px 8px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;transition:background .18s ease}
    .book:hover{background:#eeeadf}
    .book:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
    .number{align-self:start;padding-top:5px;color:#8e806d;font:14px Georgia,serif}
    .category{color:var(--muted);font-size:13px;line-height:1.6}
    h2{margin:8px 0 10px;font-size:27px;line-height:1.5;font-weight:500;letter-spacing:.035em}
    .description{margin:0;color:var(--muted);font-size:16px;line-height:1.9}
    .action{justify-self:end;color:var(--accent);font-size:16px;white-space:nowrap}
    .arrow{padding-left:10px}
    footer{padding:28px 8px;color:var(--muted);font-size:13px;line-height:1.8}
    @media(max-width:640px){main{width:calc(100% - 40px);padding-top:32px}header{padding:32px 0 28px}h1{font-size:30px}header p{font-size:16px}.book{grid-template-columns:28px minmax(0,1fr);column-gap:12px;row-gap:18px;padding:28px 4px}.action{grid-column:2;justify-self:start}h2{font-size:24px}.description{font-size:16px}footer{padding-left:4px}}
    @media(prefers-reduced-motion:reduce){.book{transition:none}}
  </style>
</head>
<body>
  <main>
    <span class="signature">Asia</span>
    <header>
      <h1>给自己一点阅读的时间。</h1>
      <p>两本书，两种陪伴。选一本，慢慢翻开。</p>
    </header>
    <nav class="books" aria-label="选择一本书">
      <a class="book" href="./answer-book/" aria-labelledby="answer-title answer-action" aria-describedby="answer-description">
        <span class="number" aria-hidden="true">01</span>
        <div>
          <span class="category">1000 页 · 清醒有力的回答</span>
          <h2 id="answer-title">答案之书</h2>
          <p class="description" id="answer-description">翻开一页，给自己一点光。<br>一句答案，少一点犹豫，多一点行动。</p>
        </div>
        <span class="action" id="answer-action">翻开一页<span class="arrow" aria-hidden="true">→</span></span>
      </a>
      <a class="book" href="./wanfeng/" aria-labelledby="wind-title wind-action" aria-describedby="wind-description">
        <span class="number" aria-hidden="true">02</span>
        <div>
          <span class="category">12 章 · 青春暗恋小说</span>
          <h2 id="wind-title">晚风替我记得</h2>
          <p class="description" id="wind-description">关于靠近、克制与长大的故事。<br>那些没说出口的话，交给晚风记得。</p>
        </div>
        <span class="action" id="wind-action">开始阅读<span class="arrow" aria-hidden="true">→</span></span>
      </a>
    </nav>
    <footer>创作者 · Asia</footer>
  </main>
</body>
</html>
