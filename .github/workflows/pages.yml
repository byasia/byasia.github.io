name: Publish Asia treasure box

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      complete_downloads:
        description: Assemble complete Android and source downloads
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and assemble complete release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: node source/assemble-release.mjs --web
      - uses: actions/configure-pages@v5
      - name: Assemble the portfolio and mini games
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/earth-universe site/aibei
          cp index.html portfolio.css playful.css portfolio.js island.js site/
          cp mini-games.css island-hunt.html island-hunt.js last-train.html last-train.js site/
          cp -a answer-book wanfeng portfolio-media source site/
          cp release-build/earth-universe-web-4.3.0.zip game.zip
          cp release-build/aibei-web-2.7.0.zip english.zip
          echo 'd6e591e770b9bd976fca4b777caae67eba143fb0fe6eb1ab2b437f526ff016e2  game.zip' | sha256sum --check
          echo '8922dab9551fcd1a6b07cfbac279ffc805099505ecc7cd6f769b0d3610b8d3cd  english.zip' | sha256sum --check
          unzip -q game.zip -d site/earth-universe
          unzip -q english.zip -d site/aibei
          test -f site/earth-universe/index.html
          test -f site/aibei/index.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  complete-downloads:
    if: github.event_name == 'workflow_dispatch' && inputs.complete_downloads
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and assemble all complete downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: node source/assemble-release.mjs
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
