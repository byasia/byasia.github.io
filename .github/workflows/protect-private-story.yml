name: Remove public plaintext history

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Requires owner approval. Type REBUILD PUBLIC HISTORY to continue.'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  protect-history:
    if: inputs.confirmation == 'REBUILD PUBLIC HISTORY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify the current story contains encrypted data only
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const allowed=/^(index\.html|lock\.js|vault\.json|OFL\.txt|sealed-\d{3}\.bin)$/;
            if(!fs.existsSync("wanfeng/vault.json"))throw Error("Encrypted story missing");
            if(!fs.readdirSync("wanfeng").every(name=>allowed.test(name)))throw Error("Plaintext is still present");
            const metadata=JSON.parse(fs.readFileSync("wanfeng/vault.json","utf8"));
            for(const part of metadata.parts)if(fs.statSync("wanfeng/"+part.name).size!==part.size)throw Error("Encrypted data incomplete");
          '
      - name: Replace main with a new root commit and remove the temporary delivery branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" --jq '.[].ref')"
          gh api "repos/$GITHUB_REPOSITORY/branches" --paginate --jq '.[].name' > /tmp/branches.txt
          while IFS= read -r branch; do
            if [[ "$branch" != main && "$branch" != delivery/works-2026-11-01 ]]; then
              echo "An additional branch needs owner review: $branch"
              exit 1
            fi
          done < /tmp/branches.txt
          tree=$(git rev-parse 'HEAD^{tree}')
          jq -n --arg tree "$tree" '{message:"Protect private story with encrypted files and a clean public history",tree:$tree,parents:[]}' > /tmp/new-root.json
          new_commit=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input /tmp/new-root.json --jq .sha)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f sha="$new_commit" -F force=true --silent
          if grep -Fxq 'delivery/works-2026-11-01' /tmp/branches.txt; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/delivery/works-2026-11-01" --silent
          fi
          printf 'New public root commit: %s\n' "$new_commit"
      - name: Delete old GitHub Pages artifacts containing plaintext
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate --jq '.artifacts[] | select(.name == "github-pages") | .id' > /tmp/old-pages-artifacts.txt
          while IFS= read -r artifact; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" --silent
          done < /tmp/old-pages-artifacts.txt
      - name: Remove old build runs referencing the public plaintext commits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs" --paginate --jq '.workflow_runs[] | [.id,.status] | @tsv' > /tmp/old-runs.tsv
          while IFS=$'\t' read -r run status; do
            if [[ "$run" == "$GITHUB_RUN_ID" ]]; then continue; fi
            if [[ "$status" != completed ]]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel" --silent || true
              sleep 3
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run" --silent
          done < /tmp/old-runs.tsv
