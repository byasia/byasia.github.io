  <style>
    :root{color-scheme:light;--paper:#f4eee3;--ink:#253a37;--soft:#69736b;--green:#36594c;--line:#cfc9b8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif;min-height:100dvh}button,input{font:inherit}a{color:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #d6a655;outline-offset:5px}[hidden]{display:none!important}.gate{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:30px clamp(20px,6vw,80px);background:radial-gradient(ellipse at 90% 6%,#d8e0ce88,transparent 50%),radial-gradient(ellipse at 8% 90%,#e4d2b455,transparent 50%)}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:13px}.back{text-decoration:none;display:inline-flex;gap:9px;align-items:center}.mark{font-family:Georgia,serif;font-size:18px;font-style:italic}.private{letter-spacing:.15em;font-size:10px;color:var(--soft)}.card{width:min(100%,470px);margin:72px auto 58px;text-align:center}.illustration{height:82px;position:relative;margin:0 auto 30px;width:110px}.illustration:before{content:"";position:absolute;width:53px;height:64px;left:29px;top:12px;background:#d0d7c5;border:1.5px solid var(--ink);border-radius:5px 12px 12px 5px;transform:rotate(-9deg);box-shadow:7px 6px 0 #e6c994}.illustration:after{content:"≈";position:absolute;top:20px;left:47px;font:40px Georgia,serif;transform:rotate(-9deg)}.eyebrow{font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--soft);margin:0 0 18px}h1{font-family:"Songti SC","Noto Serif SC","SimSun",serif;font-size:clamp(30px,7vw,42px);font-weight:500;letter-spacing:.06em;margin:0 0 18px;line-height:1.4}.intro{font-family:"Songti SC","SimSun",serif;font-size:16px;line-height:1.95;color:var(--soft);margin:0 0 36px}.field{text-align:left;margin-bottom:14px}.field label{display:block;font-size:12px;margin-bottom:9px}.input-wrap{position:relative}input{width:100%;border:1px solid #aeb7a5;background:#fffdf7;border-radius:4px;padding:16px 60px 16px 16px;font-size:17px;letter-spacing:.08em;color:var(--ink);min-height:56px}.reveal{position:absolute;right:9px;top:9px;min-height:38px;min-width:42px;font-size:12px;border:0;background:none;color:var(--soft);cursor:pointer}.unlock{border:1px solid var(--green);width:100%;border-radius:4px;background:var(--green);color:#fffcf3;min-height:55px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:17px}.unlock:hover{background:#294739}.unlock:disabled{opacity:.65;cursor:wait}.status{font-size:13px;line-height:1.7;min-height:44px;margin:15px 0 0;color:var(--soft)}.status.error{color:#9c423a}.privacy-note{border-top:1px solid var(--line);padding-top:20px;font-size:11px;line-height:1.8;color:var(--soft);margin:14px 0 0}.footer{font:12px Georgia,"SimSun",serif;text-align:center;letter-spacing:.08em;color:#7b8275;padding-bottom:3px}.reader-bar{height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--paper);border-bottom:1px solid var(--line);padding:0 18px;font-size:12px}.reader-bar div{display:flex;align-items:center;gap:18px}.reader-bar span{color:var(--soft)}.lock-again{border:1px solid #a4b09d;background:#fffdf7;color:var(--green);padding:8px 12px;border-radius:4px;cursor:pointer}.reader-host{height:calc(100dvh - 56px)}iframe{display:block;border:0;width:100%;height:100%;background:#f5f0e7}.reading{overflow:hidden}@media(max-width:480px){.gate{padding-top:22px}.card{margin-top:56px}.reader-bar{padding:0 12px}.reader-bar div{gap:12px}.reader-bar span{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>

<body>
  <main id="gate" class="gate">
    <nav class="top" aria-label="页面导航"><a href="../" class="back">← <span class="mark">Asia 的宝藏盒</span></a><span class="private">PRIVATE SHELF</span></nav>
    <section class="card" aria-labelledby="book-title">
      <div class="illustration" aria-hidden="true"></div>
      <p class="eyebrow">有些故事，只讲给知道暗号的人。</p>
      <h1 id="book-title">晚风替我记得</h1>
      <p class="intro">晚风把书签夹在了这里。<br>对上暗号，我们再慢慢翻开。</p>
      <form id="unlock-form">
        <div class="field"><label for="password">阅读密码</label><div class="input-wrap"><input id="password" name="password" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required placeholder="请输入密码" aria-describedby="status"><button class="reveal" id="reveal" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div></div>
        <button class="unlock" id="unlock" type="submit"><span id="unlock-label">翻开私藏故事</span><span aria-hidden="true">↗</span></button>
        <p class="status" id="status" role="status" aria-live="polite">正文、插图与 PDF 均需解锁后查看。</p>
      </form>
      <p class="privacy-note">密码只在此浏览器中用于解密，不会上传。<br>刷新页面或点击“重新上锁”，下次阅读需要再次输入密码。</p>
      <noscript><p>请启用 JavaScript，以在浏览器中解密阅读。</p></noscript>
    </section>
    <footer class="footer">愿你读到这里时，窗外正好有风。</footer>
  </main>
  <section id="reader" hidden aria-label="已解锁的私藏故事"><header class="reader-bar"><div><a href="../">← 宝藏盒</a><span>私藏故事 · 已解锁</span></div><button id="lock-again" class="lock-again" type="button">重新上锁 ↗</button></header><div id="reader-host" class="reader-host"></div></section>
